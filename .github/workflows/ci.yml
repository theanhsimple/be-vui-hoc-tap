name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm format:check
      # The Supabase server edition prerenders content from the database, so
      # it is built locally against `pnpm db:start` (docs/SUPABASE_SETUP.md),
      # not here. Type checks, lint and tests above cover both editions.
      - name: Build the device edition (GitHub Pages)
        run: pnpm build:device
